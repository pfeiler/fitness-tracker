<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | Fitness-Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #312e81);
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 40px 50px;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      opacity: 0.85;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
    small {
      display: block;
      margin-top: 24px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World 👋</h1>
    <p>Das ist meine erste Seite auf <strong>GitHub Pages</strong>.<br>Der Startschuss für meinen Fitness-Tracker! 💪</p>
    <span class="badge">✓ Live on GitHub Pages</span>
    <small>Weingut Kimich · Deidesheim · 2026</small>
  </div>
</body>
</html>
