<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eisenprotokoll</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#131211;
    --panel:#1d1c1a;
    --panel-2:#252420;
    --line:#38352e;
    --text:#EDEAE2;
    --text-dim:#8f8a7d;
    --accent:#C98A3E;
    --accent-dim:#8a6230;
    --record:#B23A2E;
    --good:#5c8a5c;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 100px;}

  header{padding:8px 4px 16px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;}
  h1{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.02em;margin:2px 0 0;line-height:.95;}

  .nav{display:flex;gap:8px;margin:16px 0 20px;}
  .navbtn{
    flex:1;padding:12px 8px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);font-weight:600;font-size:14px;text-align:center;
  }
  .navbtn.active{background:var(--text);color:var(--bg);border-color:var(--text);}

  .daytoggle{display:flex;gap:8px;margin:0 0 22px;}
  .daybtn{
    flex:1;padding:14px 8px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);font-weight:600;font-size:14px;text-align:center;
  }
  .daybtn .sub{display:block;font-size:11px;font-weight:400;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .daybtn.active{background:var(--accent);color:#161410;border-color:var(--accent);}
  .daybtn.active .sub{color:#3a2c14;}

  .exlist{display:flex;flex-direction:column;gap:10px;}
  .exbtn{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text);
  }
  .exbtn .name{font-size:16px;font-weight:600;}
  .exbtn .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);margin-top:3px;}
  .exbtn .arrow{color:var(--accent);font-size:20px;}
  .exbtn.expanded{border-color:var(--accent);background:var(--panel-2);}

  .card{
    background:var(--panel-2);border:1px solid var(--accent-dim);border-radius:var(--radius);
    margin-top:-4px;margin-bottom:10px;padding:18px 16px 16px;
  }

  .datefield{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:10px 12px;background:var(--panel);border-radius:10px;}
  .datefield label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;}
  .datefield .date-now{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--accent);}

  .platebar{display:flex;gap:3px;height:26px;align-items:flex-end;margin-bottom:14px;}
  .plate{flex:1;background:var(--accent-dim);border-radius:2px;min-width:3px;transition:height .2s;}
  .plate.filled{background:var(--accent);}

  .stepper-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px;}
  .stepbtn{
    width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--accent);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;
  }
  .stepbtn:active{background:var(--accent);color:#161410;}
  .stepval{min-width:118px;text-align:center;}
  .stepval .num{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:1;}
  .stepval .unit{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;}

  .steplabel{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}

  .microbtns{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
  .microbtn{
    padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;
    color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12px;
  }
  .microbtn:active{background:var(--panel);}

  .target{
    display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);
    border-radius:10px;margin-bottom:16px;font-size:13px;color:var(--text-dim);
  }
  .target b{color:var(--text);font-weight:600;}
  .target .tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;}

  .logbtn{
    width:100%;padding:18px;border-radius:var(--radius);border:none;background:var(--accent);
    color:#161410;font-weight:700;font-size:16px;letter-spacing:.02em;
  }
  .logbtn:active{background:var(--accent-dim);}
  .logbtn.pr{background:var(--record);color:#f5ece9;}

  .history{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .history .h-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
  .h-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .h-row span:first-child{color:var(--text);}

  /* overview / all-entries view */
  .ov-group{margin-bottom:22px;}
  .ov-date{
    font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.03em;color:var(--accent);
    margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .ov-entry{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:var(--panel);border-radius:10px;margin-bottom:6px;
  }
  .ov-entry .ex-name{font-size:14px;font-weight:600;}
  .ov-entry .ex-val{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim);margin-top:2px;}
  .ov-del{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--text-dim);font-size:16px;flex-shrink:0;margin-left:10px;
  }
  .ov-del:active{background:var(--record);color:#fff;border-color:var(--record);}
  .ov-empty{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center;padding:40px 10px;}

  .reset-row{margin-bottom:18px;}
  .resetbtn{
    width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--record);
    background:transparent;color:var(--record);font-weight:600;font-size:13px;
  }
  .resetbtn:active{background:var(--record);color:#f5ece9;}

  .transfer-row{display:flex;gap:8px;margin:18px 0;}
  .transferbtn{
    flex:1;padding:13px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-weight:600;font-size:13px;
  }
  .transferbtn:active{background:var(--accent);color:#161410;border-color:var(--accent);}
  .transfer-note{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--text-dim);margin:-10px 0 18px;line-height:1.5;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#161410;padding:12px 22px;border-radius:30px;font-weight:600;
    font-size:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.pr{background:var(--record);color:#f5ece9;}

  /* day progress status bar (train view) */
  .day-status{
    display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  }
  .day-status .ds-ic{font-size:20px;line-height:1;}
  .day-status .ds-txt{flex:1;font-size:13px;color:var(--text-dim);line-height:1.35;}
  .day-status .ds-txt b{color:var(--text);}
  .day-status.done{border-color:var(--good);}
  .day-status.done .ds-txt{color:var(--good);}

  /* overview group highlight when a day is complete */
  .ov-group.done{background:var(--panel);border:1px solid var(--good);border-radius:var(--radius);padding:12px;}
  .ov-group.done .ov-date{color:var(--good);border-bottom-color:var(--good);}
  .ov-check{
    display:inline-flex;align-items:center;gap:6px;float:right;margin-top:2px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--good);
    border:1px solid var(--good);border-radius:20px;padding:3px 10px;text-transform:uppercase;
    letter-spacing:.08em;
  }
  .ov-group:not(.done) .ov-check{display:none;}

  /* confetti */
  .confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:999;}
  .confetti i{
    position:absolute;top:-12px;display:block;width:8px;height:12px;border-radius:2px;
    animation:cf-fall linear forwards;
  }
  @keyframes cf-fall{
    to{transform:translateY(110vh) rotate(720deg);opacity:.2;}
  }

  .empty{color:var(--text-dim);font-size:13px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header></header>

  <div class="nav" id="nav"></div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'workout-data';

const GYMS = {
  woellstadt: {
    label: 'Wöllstadt',
    days: {
      A: {
        label: 'Tag A', sub: 'Oberkörper',
        exercises: [
          {id:'stairmaster', name:'Stairmaster', type:'cardio', defReps:0},
          {id:'butterfly', name:'Butterfly', type:'weight', step:2.5, defReps:12},
          {id:'reverse_butterfly', name:'Reverse Butterfly', type:'weight', step:2.5, defReps:12},
          {id:'schulter', name:'Schulterpresse', type:'weight', step:2.5, defReps:10},
          {id:'chest_press', name:'Brustpresse', type:'weight', step:2.5, defReps:10},
          {id:'low_row', name:'Low Row', type:'weight', step:2.5, defReps:12},
          {id:'seitheben', name:'Seitheben', type:'weight', step:2.5, defReps:12},
        ]
      },
      B: {
        label: 'Tag B', sub: 'Unterkörper',
        exercises: [
          {id:'stairmaster', name:'Stairmaster', type:'cardio', defReps:0},
          {id:'beinpresse', name:'Beinpresse', type:'weight', step:5, defReps:12},
          {id:'beinstrecker', name:'Beinstrecker', type:'weight', step:2.5, defReps:12},
          {id:'beinbeuger', name:'Beinbeuger', type:'weight', step:2.5, defReps:12},
          {id:'wade', name:'Wadenheber', type:'weight', step:2.5, defReps:15},
          {id:'crunch', name:'Crunch', type:'weight', step:2.5, defReps:15},
          {id:'kickbacks', name:'Kickbacks', type:'weight', step:2.5, defReps:12},
        ]
      }
    }
  },
  friedberg: {
    label: 'Friedberg',
    days: {
      A: {
        label: 'Tag A', sub: 'Oberkörper',
        exercises: [
          {id:'stairmaster', name:'Stairmaster', type:'cardio', defReps:0},
          {id:'fb_chest_press', name:'Brustpresse', type:'weight', step:2.5, defReps:10},
          {id:'fb_reverse_butterfly', name:'Reverse Butterfly', type:'weight', step:2.5, defReps:12},
          {id:'fb_seitenheben', name:'Seitenheben', type:'weight', step:2.5, defReps:12},
          {id:'fb_high_row', name:'High Row', type:'weight', step:2.5, defReps:12},
        ]
      },
      B: {
        label: 'Tag B', sub: 'Unterkörper',
        exercises: [
          {id:'stairmaster', name:'Stairmaster', type:'cardio', defReps:0},
          {id:'fb_beinpresse', name:'Beinpresse', type:'weight', step:5, defReps:12},
          {id:'fb_beinstrecker', name:'Beinstrecker', type:'weight', step:2.5, defReps:12},
          {id:'fb_beinbeuger', name:'Beinbeuger', type:'weight', step:2.5, defReps:12},
          {id:'fb_deadlift', name:'Deadlift', type:'weight', step:2.5, defReps:8},
          {id:'fb_wade', name:'Wadenheber', type:'weight', step:2.5, defReps:15},
        ]
      }
    }
  }
};
const DAYS = GYMS.woellstadt.days; // legacy alias, kept for ARCHIVED_EXERCISES merge below

// exercises no longer shown in the active day lists, kept only so past
// entries still resolve to a readable name in the Verlauf (history) view.
// exerciseId is the permanent key for stored data — display names may
// change freely without ever affecting saved entries.
const ARCHIVED_EXERCISES = {
  high_row: {id:'high_row', name:'High Row (breiter Griff)', type:'weight'},
  rudern: {id:'rudern', name:'Rudern (Row)', type:'weight'},
  ruecken_str: {id:'ruecken_str', name:'Rückenstrecker', type:'weight'},
  bauch: {id:'bauch', name:'Bauch (Kabel/Crunch)', type:'weight'},
};

// master lookup across both days (+ archive), for the overview/history rendering
const ALL_EXERCISES = {};
Object.values(GYMS).forEach(g=>Object.values(g.days).forEach(d=>d.exercises.forEach(ex=>{ ALL_EXERCISES[ex.id] = ex; })));
Object.values(ARCHIVED_EXERCISES).forEach(ex=>{ if(!ALL_EXERCISES[ex.id]) ALL_EXERCISES[ex.id] = ex; });

let state = { view: 'train', gym: 'woellstadt', day: 'A', expanded: null, current: {} };
let data = { entries: [] }; // {id, exerciseId, weight, reps, level, mins, date}

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){ const d = JSON.parse(saved); if(d && Array.isArray(d.entries)) data = d; }
  }catch(e){ /* kein Storage bzw. korrupte Daten → leer starten */ }
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function entriesFor(exId){
  return data.entries.filter(e=>e.exerciseId===exId).sort((a,b)=> (a.date+a.id) < (b.date+b.id) ? 1 : -1);
}
function lastSession(exId){
  const list = entriesFor(exId);
  if(!list.length) return null;
  const lastDate = list[0].date;
  return list.filter(e=>e.date===lastDate);
}
function todaySets(exId){
  const t = todayStr();
  return data.entries.filter(e=>e.exerciseId===exId && e.date===t);
}
function bestWeight(exId){
  const list = entriesFor(exId);
  if(!list.length) return null;
  return Math.max(...list.map(e=>e.weight||0));
}

function renderNav(){
  const el = document.getElementById('nav');
  el.innerHTML = '';
  const tabs = [ {k:'train', label:'Training'}, {k:'history', label:'Verlauf'} ];
  tabs.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'navbtn' + (state.view===t.k?' active':'');
    b.textContent = t.label;
    b.onclick = ()=>{ state.view = t.k; render(); };
    el.appendChild(b);
  });
}

function renderGymToggle(container){
  const el = document.createElement('div');
  el.className = 'daytoggle';
  Object.keys(GYMS).forEach(k=>{
    const g = GYMS[k];
    const btn = document.createElement('button');
    btn.className = 'daybtn' + (state.gym===k?' active':'');
    btn.innerHTML = `${g.label}`;
    btn.onclick = ()=>{ state.gym=k; state.day='A'; state.expanded=null; render(); };
    el.appendChild(btn);
  });
  container.appendChild(el);
}

function renderDayToggle(container){
  const el = document.createElement('div');
  el.className = 'daytoggle';
  const days = GYMS[state.gym].days;
  Object.keys(days).forEach(k=>{
    const d = days[k];
    const btn = document.createElement('button');
    btn.className = 'daybtn' + (state.day===k?' active':'');
    btn.innerHTML = `${d.label}<span class="sub">${d.sub}</span>`;
    btn.onclick = ()=>{ state.day=k; state.expanded=null; render(); };
    el.appendChild(btn);
  });
  container.appendChild(el);
}

function initCurrent(ex){
  if(state.current[ex.id]) return;
  if(ex.type==='weight'){
    const best = bestWeight(ex.id);
    state.current[ex.id] = { weight: best || (ex.step*4), reps: ex.defReps, date: todayStr() };
  } else {
    state.current[ex.id] = { level: 5, mins: 20, date: todayStr() };
  }
}

function renderExList(container){
  const el = document.createElement('div');
  el.className = 'exlist';
  const day = GYMS[state.gym].days[state.day];
  if(!day.exercises.length){
    const e = document.createElement('div');
    e.className = 'ov-empty';
    e.textContent = 'Für dieses Studio sind noch keine Übungen hinterlegt.';
    el.appendChild(e);
    container.appendChild(el);
    return;
  }
  day.exercises.forEach(ex=>{
    const wrap = document.createElement('div');
    const isOpen = state.expanded === ex.id;
    const setsToday = todaySets(ex.id).length;

    const btn = document.createElement('div');
    btn.className = 'exbtn' + (isOpen?' expanded':'');
    let metaText = 'Noch nicht geloggt';
    const last = lastSession(ex.id);
    if(last && last.length){
      if(ex.type==='weight'){
        const l = last[last.length-1];
        metaText = `Zuletzt: ${l.weight}kg × ${l.reps}`;
      } else {
        const l = last[last.length-1];
        metaText = `Zuletzt: Stufe ${l.level} · ${l.mins} Min`;
      }
    }
    if(setsToday>0) metaText += ` · Heute: ${setsToday}`;
    btn.innerHTML = `<div><div class="name">${ex.name}</div><div class="meta">${metaText}</div></div><div class="arrow">${isOpen?'−':'+'}</div>`;
    btn.onclick = ()=>{ state.expanded = isOpen ? null : ex.id; render(); };
    wrap.appendChild(btn);

    if(isOpen){
      initCurrent(ex);
      wrap.appendChild(renderCard(ex));
    }
    el.appendChild(wrap);
  });
  container.appendChild(el);
}

function renderCard(ex){
  const card = document.createElement('div');
  card.className = 'card';
  const cur = state.current[ex.id];

  // date display — heute wird automatisch erfasst, keine Eingabe nötig
  const dfield = document.createElement('div');
  dfield.className = 'datefield';
  dfield.innerHTML = `<label>Datum</label><span class="date-now">${formatDateLabel(todayStr())}</span>`;
  card.appendChild(dfield);

  if(ex.type==='weight'){
    const plateCount = 14;
    const filled = Math.min(plateCount, Math.round(cur.weight / 5));
    let plates = '';
    for(let i=0;i<plateCount;i++){
      const h = 10 + Math.min(16, i*1.1);
      plates += `<div class="plate ${i<filled?'filled':''}" style="height:${h}px"></div>`;
    }
    card.innerHTML += `<div class="platebar">${plates}</div>`;

    card.innerHTML += `<div class="steplabel">Gewicht</div>`;
    const wrow = document.createElement('div');
    wrow.className = 'stepper-row';
    wrow.innerHTML = `
      <button class="stepbtn" data-act="w-" >−</button>
      <div class="stepval"><div class="num">${cur.weight}</div><div class="unit">kg</div></div>
      <button class="stepbtn" data-act="w+">+</button>
    `;
    card.appendChild(wrow);

    const micro = document.createElement('div');
    micro.className = 'microbtns';
    [-10,-5,5,10].forEach(v=>{
      const b = document.createElement('button');
      b.className='microbtn'; b.textContent=(v>0?'+':'')+v;
      b.onclick=()=>{ cur.weight = Math.max(0, round25(cur.weight+v)); render(); };
      micro.appendChild(b);
    });
    card.appendChild(micro);

    card.innerHTML += `<div class="steplabel">Wiederholungen</div>`;
    const rrow = document.createElement('div');
    rrow.className = 'stepper-row';
    rrow.innerHTML = `
      <button class="stepbtn" data-act="r-">−</button>
      <div class="stepval"><div class="num">${cur.reps}</div><div class="unit">Wdh</div></div>
      <button class="stepbtn" data-act="r+">+</button>
    `;
    card.appendChild(rrow);

    const best = bestWeight(ex.id);
    const target = document.createElement('div');
    target.className='target';
    if(best){
      target.innerHTML = `<span class="tag">Ziel</span><span>Rekord schlagen: <b>${best}kg</b></span>`;
    } else {
      target.innerHTML = `<span class="tag">Start</span><span>Erster Eintrag für diese Übung</span>`;
    }
    card.appendChild(target);

    const isPR = best!==null && cur.weight > best;
    const logBtn = document.createElement('button');
    logBtn.className = 'logbtn' + (isPR?' pr':'');
    logBtn.textContent = isPR ? '🔥 Satz loggen — neuer Rekord!' : 'Satz loggen';
    logBtn.onclick = ()=> logSet(ex, cur);
    card.appendChild(logBtn);

    card.querySelectorAll('.stepbtn').forEach(b=>{
      b.onclick = ()=>{
        const act = b.dataset.act;
        if(act==='w-') cur.weight = Math.max(0, round25(cur.weight - ex.step));
        if(act==='w+') cur.weight = round25(cur.weight + ex.step);
        if(act==='r-') cur.reps = Math.max(1, cur.reps - 1);
        if(act==='r+') cur.reps = cur.reps + 1;
        render();
      };
    });

  } else {
    // cardio (Stairmaster)
    card.innerHTML += `<div class="steplabel">Stufe</div>`;
    const lrow = document.createElement('div');
    lrow.className = 'stepper-row';
    lrow.innerHTML = `
      <button class="stepbtn" data-act="l-">−</button>
      <div class="stepval"><div class="num">${cur.level}</div><div class="unit">Stufe</div></div>
      <button class="stepbtn" data-act="l+">+</button>
    `;
    card.appendChild(lrow);

    card.innerHTML += `<div class="steplabel">Dauer</div>`;
    const mrow = document.createElement('div');
    mrow.className = 'stepper-row';
    mrow.innerHTML = `
      <button class="stepbtn" data-act="m-">−</button>
      <div class="stepval"><div class="num">${cur.mins}</div><div class="unit">Minuten</div></div>
      <button class="stepbtn" data-act="m+">+</button>
    `;
    card.appendChild(mrow);

    const logBtn = document.createElement('button');
    logBtn.className = 'logbtn';
    logBtn.textContent = 'Einheit loggen';
    logBtn.onclick = ()=> logSet(ex, cur);
    card.appendChild(logBtn);

    card.querySelectorAll('.stepbtn').forEach(b=>{
      b.onclick = ()=>{
        const act = b.dataset.act;
        if(act==='l-') cur.level = Math.max(1, cur.level - 1);
        if(act==='l+') cur.level = Math.min(20, cur.level + 1);
        if(act==='m-') cur.mins = Math.max(5, cur.mins - 5);
        if(act==='m+') cur.mins = cur.mins + 5;
        render();
      };
    });
  }

  // history (last session for this exercise)
  const last = lastSession(ex.id);
  const hist = document.createElement('div');
  hist.className = 'history';
  hist.innerHTML = `<div class="h-title">Letzte Einheit</div>`;
  if(last && last.length){
    last.slice(-4).forEach(l=>{
      const row = document.createElement('div');
      row.className = 'h-row';
      if(ex.type==='weight'){
        row.innerHTML = `<span>${l.weight}kg × ${l.reps}</span><span>${formatDateLabel(l.date)}</span>`;
      } else {
        row.innerHTML = `<span>Stufe ${l.level} · ${l.mins} Min</span><span>${formatDateLabel(l.date)}</span>`;
      }
      hist.appendChild(row);
    });
  } else {
    hist.innerHTML += `<div class="empty">Noch keine Einträge.</div>`;
  }
  card.appendChild(hist);

  return card;
}

function round25(v){ return Math.round(v*2)/2; }

async function logSet(ex, cur){
  const entry = { id: Date.now()+'-'+Math.random().toString(36).slice(2,7), exerciseId: ex.id, date: todayStr() };
  let isPR = false;
  const wasComplete = dayProgress(state.gym, state.day, todayStr()).complete;
  if(ex.type==='weight'){
    const best = bestWeight(ex.id);
    isPR = best!==null && cur.weight > best;
    entry.weight = cur.weight; entry.reps = cur.reps;
  } else {
    entry.level = cur.level; entry.mins = cur.mins;
  }
  data.entries.push(entry);
  await saveData();
  const nowComplete = dayProgress(state.gym, state.day, todayStr()).complete;
  render();
  if(nowComplete && !wasComplete){
    confetti();
  } else {
    showToast(isPR ? '🔥 Neuer Rekord gespeichert!' : 'Satz gespeichert', isPR);
  }
}

const WEEKDAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-');
  const dt = new Date(dateStr+'T00:00:00');
  const wd = WEEKDAYS[dt.getDay()];
  return `${wd}, ${d}.${m}.${y}`;
}

/* ---- TAGES-FORTSCHRITT: Stairmaster 1x + jede Gewichtsübung 3x ---- */
function dayRequired(gym, day){
  // Stairmaster (cardio) wird 1x, jede Gewichtsübung 3x geloggt
  return GYMS[gym].days[day].exercises.map(ex=>({
    id: ex.id,
    name: ex.name,
    type: ex.type,
    need: ex.type==='cardio' ? 1 : 3
  }));
}
function dayProgress(gym, day, date){
  const req = dayRequired(gym, day);
  const counts = {};
  req.forEach(r=>{ counts[r.id]=0; });
  data.entries.forEach(e=>{
    if(e.date===date && counts[e.exerciseId] !== undefined) counts[e.exerciseId]++;
  });
  const missing = req.filter(r=> counts[r.id] < r.need);
  return {
    total: req.length,
    doneCount: req.length - missing.length,
    missing: missing,
    complete: missing.length===0
  };
}

/* Konfetti-Fontäne */
function confetti(){
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  const colors = ['#C98A3E','#3aa76d','#4f8cff','#e5484d','#f5b942','#8a5cf5'];
  const n = 60;
  for(let i=0;i<n;i++){
    const c = document.createElement('i');
    const dur = 1.4 + Math.random()*1.4;
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width = (6+Math.random()*6)+'px';
    c.style.height = (10+Math.random()*8)+'px';
    c.style.animationDuration = dur+'s';
    c.style.animationDelay = (Math.random()*0.5)+'s';
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  showToast('🎉 Alles für heute erledigt!', false);
  setTimeout(()=>{ wrap.remove(); }, 3200);
}

function renderHistory(container){
  const resetRow = document.createElement('div');
  resetRow.className = 'reset-row';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'resetbtn';
  resetBtn.textContent = 'Alle Daten löschen';
  resetBtn.onclick = async ()=>{
    if(confirm('Wirklich ALLE gespeicherten Trainingsdaten unwiderruflich löschen?')){
      data.entries = [];
      await saveData();
      render();
      showToast('Alle Daten gelöscht', false);
    }
  };
  resetRow.appendChild(resetBtn);
  container.appendChild(resetRow);

  // Backup exportieren / importieren (Geräteübergriff via Datei)
  const transfer = document.createElement('div');
  transfer.className = 'transfer-row';
  const dlBtn = document.createElement('button');
  dlBtn.className = 'transferbtn';
  dlBtn.textContent = '⬇ Backup downloaden';
  dlBtn.onclick = exportData;
  const imBtn = document.createElement('button');
  imBtn.className = 'transferbtn';
  imBtn.textContent = '⬆ Backup importieren';
  const fileIn = document.createElement('input');
  fileIn.type = 'file';
  fileIn.accept = '.json,application/json';
  fileIn.style.display = 'none';
  imBtn.onclick = ()=>{ fileIn.click(); };
  fileIn.onchange = ()=>{ if(fileIn.files && fileIn.files[0]) importData(fileIn.files[0]); fileIn.value=''; };
  transfer.appendChild(dlBtn);
  transfer.appendChild(imBtn);
  transfer.appendChild(fileIn);
  container.appendChild(transfer);
  const note = document.createElement('div');
  note.className = 'transfer-note';
  note.textContent = 'Download speichert alle Daten als Datei — damit transferierbar auf ein anderes Gerät (z.B. Windows). Import lädt so eine Datei wieder rein (Doppelte werden übersprungen).';
  container.appendChild(note);

  if(!data.entries.length){
    const e = document.createElement('div');
    e.className = 'ov-empty';
    e.textContent = 'Noch keine Einträge geloggt. Starte im Reiter "Training".';
    container.appendChild(e);
    return;
  }
  // group by date, newest date first; within a date, newest logged first
  const byDate = {};
  data.entries.forEach(e=>{
    (byDate[e.date] = byDate[e.date] || []).push(e);
  });
  const dates = Object.keys(byDate).sort((a,b)=> a<b?1:-1).slice(0,3);

  dates.forEach(date=>{
    // komplett, wenn für dieses Datum Tag A oder Tag B des aktuellen Gyms erfüllt ist
    const dayKeys = Object.keys(GYMS[state.gym].days);
    const doneForDate = dayKeys.some(k=> dayProgress(state.gym, k, date).complete);

    const group = document.createElement('div');
    group.className = 'ov-group' + (doneForDate ? ' done' : '');
    const h = document.createElement('div');
    h.className = 'ov-date';
    h.textContent = formatDateLabel(date);
    group.appendChild(h);
    if(doneForDate){
      const chk = document.createElement('span');
      chk.className = 'ov-check';
      chk.textContent = '✓ komplett';
      group.appendChild(chk);
    }

    const rows = byDate[date].slice().sort((a,b)=> b.id.localeCompare(a.id));
    rows.forEach(e=>{
      const ex = ALL_EXERCISES[e.exerciseId] || {name:e.exerciseId, type:'weight'};
      const row = document.createElement('div');
      row.className = 'ov-entry';
      const valText = ex.type==='weight'
        ? `${e.weight}kg × ${e.reps}`
        : `Stufe ${e.level} · ${e.mins} Min`;
      row.innerHTML = `<div><div class="ex-name">${ex.name}</div><div class="ex-val">${valText}</div></div>`;
      const del = document.createElement('button');
      del.className = 'ov-del';
      del.textContent = '×';
      del.onclick = async ()=>{
        data.entries = data.entries.filter(x=>x.id!==e.id);
        await saveData();
        render();
      };
      row.appendChild(del);
      group.appendChild(row);
    });

    container.appendChild(group);
  });
}

function render(){
  renderNav();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(state.view === 'train'){
    renderGymToggle(content);
    renderDayToggle(content);
    renderDayStatus(content);
    renderExList(content);
  } else {
    renderHistory(content);
  }
}

/* Statuszeile: wie viel vom heutigen Training schon erledigt ist */
function renderDayStatus(container){
  const p = dayProgress(state.gym, state.day, todayStr());
  const el = document.createElement('div');
  el.className = 'day-status' + (p.complete ? ' done' : '');
  let icon = p.complete ? '✅' : '⏳';
  let text;
  if(p.complete){
    text = 'Fertig! <b>Alle Übungen für ' + GYMS[state.gym].days[state.day].label + ' erledigt.</b>';
  } else {
    const missingNames = p.missing.map(m=> m.need>1 ? m.name + ' ×' + m.need : m.name).join(', ');
    text = '<b>' + p.doneCount + '/' + p.total + '</b> erledigt' +
      (p.missing.length ? ' — offen: ' + missingNames : '');
  }
  el.innerHTML = '<span class="ds-ic">' + icon + '</span><div class="ds-txt">' + text + '</div>';
  container.appendChild(el);
}

function exportData(){
  const payload = JSON.stringify({ app:'fitness-tracker', exportedAt:todayStr(), entries:data.entries }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitness-tracker-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 800);
  showToast('Backup-Datei erstellt', false);
}

async function importData(file){
  try{
    const parsed = JSON.parse(await file.text());
    const entries = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.entries) ? parsed.entries : []);
    if(!entries.length) throw new Error('keine Einträge');
    const map = new Map(data.entries.map(e=>[e.id,e]));
    let added = 0;
    entries.forEach(e=>{ if(e && e.id && !map.has(e.id)){ map.set(e.id,e); added++; } });
    if(added===0){
      showToast('Keine neuen Einträge (alles Duplikate)', false);
      return;
    }
    if(!confirm(`Backup enthält ${entries.length} Einträge. ${added} neue werden übernommen, Duplikate übersprungen. Fortfahren?`)) return;
    data.entries = Array.from(map.values());
    saveData();
    render();
    showToast(`${added} Einträge importiert`, false);
  }catch(e){
    showToast('Import fehlgeschlagen: ungültige Datei', false);
  }
}

function showToast(msg, isPR){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isPR?' pr':'');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.className='toast'; }, 1600);
}

(async function init(){
  await loadData();
  render();
})();
</script>
